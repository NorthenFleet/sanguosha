<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国杀 1v1 网页版预览</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="brand">三国杀</div>
        <div class="controls">
          <button id="btn-new-game">新游戏</button>
          <button id="btn-back">返回菜单</button>
        </div>
      </header>

      <main class="game-layout">
        <!-- 顶部：对手区域 -->
        <section class="opponent-area">
          <div class="opponent-info">
            <div class="player-avatar">
              <div class="character-portrait" id="opponent-portrait">孙权</div>
              <div class="player-name" id="opponent-name">对手</div>
            </div>
            <div class="player-stats">
              <div class="hp-section">
                <label>血量</label>
                <div class="hp-bar">
                  <div class="hp-fill" id="opponent-hp-fill" style="width: 100%"></div>
                </div>
                <div class="hp-text" id="opponent-hp-text">4 / 4</div>
              </div>
              <div class="equipment-section">
                <div class="equipment-slot" id="opponent-weapon" data-type="武器"></div>
                <div class="equipment-slot" id="opponent-defense" data-type="防具"></div>
                <div class="equipment-slot" id="opponent-attack-horse" data-type="+1马"></div>
                <div class="equipment-slot" id="opponent-defense-horse" data-type="-1马"></div>
              </div>
            </div>
            <div class="hand-info">
              <div class="hand-count">手牌: <span id="opponent-hand-count">5</span></div>
              <div class="judgment-area" id="opponent-judgment"></div>
            </div>
          </div>
        </section>

        <!-- 中央：游戏桌面 -->
        <section class="game-table">
          <div class="table-center">
            <div class="deck-area">
              <div class="deck-pile" id="deck">
                <div class="pile-icon">🂠</div>
                <div class="pile-count">剩余: <span id="deck-count">104</span></div>
              </div>
              <div class="discard-pile" id="discard">
                <div class="pile-icon">🗑️</div>
                <div class="pile-count">弃牌: <span id="discard-count">0</span></div>
              </div>
            </div>
            <div class="game-status">
              <div class="current-phase" id="current-phase">准备阶段</div>
              <div class="turn-indicator" id="turn-indicator">你的回合</div>
            </div>
          </div>
          
          <div class="action-panel">
            <div class="action-buttons">
              <button id="btn-play-card" class="action-btn primary">出牌</button>
              <button id="btn-use-skill" class="action-btn secondary">技能</button>
              <button id="btn-end-turn" class="action-btn end-turn">结束回合</button>
            </div>
          </div>
        </section>

        <!-- 底部：玩家区域 -->
        <section class="player-area">
          <div class="player-info">
            <div class="player-avatar">
              <div class="character-portrait" id="player-portrait">曹操</div>
              <div class="player-name" id="player-name">玩家</div>
            </div>
            <div class="player-stats">
              <div class="hp-section">
                <label>血量</label>
                <div class="hp-bar">
                  <div class="hp-fill" id="player-hp-fill" style="width: 75%"></div>
                </div>
                <div class="hp-text" id="player-hp-text">3 / 4</div>
              </div>
              <div class="equipment-section">
                <div class="equipment-slot" id="player-weapon" data-type="武器"></div>
                <div class="equipment-slot" id="player-defense" data-type="防具"></div>
                <div class="equipment-slot" id="player-attack-horse" data-type="+1马"></div>
                <div class="equipment-slot" id="player-defense-horse" data-type="-1马"></div>
              </div>
            </div>
            <div class="judgment-area" id="player-judgment"></div>
          </div>
          
          <div class="hand-area">
            <div class="hand-header">
              <span class="hand-title">手牌</span>
              <span class="hand-count">(<span id="player-hand-count">5</span>张)</span>
            </div>
            <div class="hand-cards" id="player-hand">
              <!-- 手牌将在这里动态生成 -->
            </div>
          </div>
        </section>

        <!-- 侧边：游戏日志 -->
        <aside class="game-log">
          <div class="log-header">游戏记录</div>
          <div class="log-content" id="log">
            <div class="log-entry">游戏开始</div>
          </div>
        </aside>
      </main>

      <footer class="status-bar">
        <div id="status-text">准备开始游戏...</div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
  </html>
